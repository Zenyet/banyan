# Builds the macOS, Linux and Windows packages. Pushing a v* tag also
# publishes them as a GitHub release; pushes to ci/** branches only build.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux packages
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon0

      - name: Install Inno Setup
        if: matrix.name == 'Windows'
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Test
        id: test
        if: matrix.name != 'Windows'
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log

      - name: Report test failures
        if: failure() && matrix.name != 'Windows'
        run: |
          grep -E '^(--- FAIL|FAIL|panic:|ok |.*\.go:[0-9]+:)' test.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Package (macOS)
        if: matrix.name == 'macOS'
        run: scripts/package-macos.sh

      - name: Package (Linux)
        if: matrix.name == 'Linux'
        run: scripts/package-linux.sh

      - name: Package (Windows)
        if: matrix.name == 'Windows'
        run: scripts/package-windows.ps1

      # Start each build once: it opens this repository and quits by itself.
      # A crash at launch never prints the line the check looks for.
      - name: Smoke test (macOS)
        if: matrix.name == 'macOS'
        timeout-minutes: 2
        run: |
          BANYAN_SMOKE_TEST=1 build/arm64/Banyan.app/Contents/MacOS/banyan . | tee smoke.log
          grep -q "smoke test passed" smoke.log

      - name: Smoke test (Linux)
        if: matrix.name == 'Linux'
        timeout-minutes: 2
        run: |
          xvfb-run -a env BANYAN_SMOKE_TEST=1 build/banyan . | tee smoke.log
          grep -q "smoke test passed" smoke.log

      - name: Smoke test (Windows)
        if: matrix.name == 'Windows'
        timeout-minutes: 2
        run: |
          $env:BANYAN_SMOKE_TEST = "1"
          $app = Start-Process build\banyan.exe -ArgumentList "." -Wait -PassThru -RedirectStandardOutput smoke.log
          Get-Content smoke.log
          if ($app.ExitCode -ne 0 -or -not (Select-String -Quiet "smoke test passed" smoke.log)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: banyan-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the update manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          names = {
              "darwin/arm64": f"Banyan-{version}-macos-arm64.zip",
              "darwin/amd64": f"Banyan-{version}-macos-x86_64.zip",
              "windows/amd64": f"Banyan-{version}-windows-x64-setup.exe",
              "linux/amd64": f"Banyan-{version}-linux-x86_64.tar.gz",
          }
          platforms = {}
          for key, name in names.items():
              path = os.path.join("dist", name)
              if not os.path.exists(path):
                  raise SystemExit(f"missing update asset: {path}")
              digest = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      digest.update(chunk)
              platforms[key] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": digest.hexdigest(),
                  "size": os.path.getsize(path),
              }
          manifest = {
              "version": version,
              "notes_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "platforms": platforms,
          }
          with open("dist/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
